name: 功能请求
description: 建议新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机
      description: 该功能解决什么问题？当前有哪些限制？
      placeholder: |
        当我使用 javinizer 整理文件时，我不得不手动做 X 操作，因为...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 描述你希望看到的功能或行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 你是否尝试过其他变通方法或替代方案？

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 这与 javinizer 的哪个部分相关？
      multiple: true
      options:
        - CLI 命令
        - TUI
        - API / Web UI
        - 文件匹配
        - 抓取器
        - 文件整理
        - 配置
        - 数据库
        - 图片 / NFO 生成
        - 其他
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 任何其他上下文、截图或示例。